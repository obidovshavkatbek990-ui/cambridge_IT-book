<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Nazorat Testi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #2c3e50; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .question-title { font-weight: 600; margin-bottom: 10px; color: #34495e; }
        .option { display: block; margin-bottom: 8px; cursor: pointer; }
        .text-answer-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #3498db;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }
        .btn-submit {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h2>Informatika va AT — Test Nazorati</h2>
    
    <div class="input-group">
        <label for="studentName">O'quvchi Ismi va Familiyasi:</label>
        <input type="text" id="studentName" placeholder="Masalan: Shavkatbek Obidov" required>
    </div>

    <div id="quizContainer"></div>

    <button class="btn-submit" onclick="submitQuiz()">Testni Yakunlash</button>
</div>

<script>
    // Test savollari ro'yxati (Variantli va Ochiq matnli)
    const quizData = [
        {
            id: 1,
            type: "choice", // Variantli savol
            question: "1. Veb-sahifaning karkasini (tuzilishini) yaratuvchi til qaysi?",
            options: ["CSS", "HTML", "Python", "JavaScript"],
            correct: "HTML"
        },
        {
            id: 2,
            type: "text", // Ochiq matnli savol
            question: "2. CSS qisqartmasining to'liq nomini yozing:",
            correct: "Cascading Style Sheets"
        },
        {
            id: 3,
            type: "text", // Ochiq matnli savol
            question: "3. Kompyuterning asosiy miyasi hisoblangan qurilma qisqartmasi nimadir?",
            correct: "CPU"
        }
    ];

    // Savollarni ekranga chiqarish
    function renderQuiz() {
        const container = document.getElementById("quizContainer");
        container.innerHTML = "";

        quizData.forEach((q, index) => {
            const card = document.createElement("div");
            card.className = "question-card";

            let content = `<div class="question-title">${q.question}</div>`;

            if (q.type === "choice") {
                q.options.forEach(opt => {
                    content += `
                        <label class="option">
                            <input type="radio" name="q${q.id}" value="${opt}"> ${opt}
                        </label>
                    `;
                });
            } else if (q.type === "text") {
                content += `
                    <input type="text" class="text-answer-input" id="q${q.id}" placeholder="Javobingizni shu yerga yozing...">
                `;
            }

            card.innerHTML = content;
            container.appendChild(card);
        });
    }

    // Natijani hisoblash va jo'natish
    function submitQuiz() {
        const name = document.getElementById("studentName").value.trim();
        if (!name) {
            alert("Iltimos, ismingizni kiriting!");
            return;
        }

        let score = 0;

        quizData.forEach(q => {
            if (q.type === "choice") {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected && selected.value === q.correct) {
                    score++;
                }
            } else if (q.type === "text") {
                const userAns = document.getElementById(`q${q.id}`).value.trim().toLowerCase();
                const correctAns = q.correct.trim().toLowerCase();
                if (userAns === correctAns) {
                    score++;
                }
            }
        });

        alert(`Rahmat ${name}! Siz ${quizData.length} ta savoldan ${score} ta to'g'ri javob berdingiz.`);
        
        // Bu yerda natijani Firebase-ga yuklash kodingiz joylashadi
    }

    // Sahifa yuklanganda testni chiqarish
    renderQuiz();
</script>

</body>
</html>
