<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Test Boshqaruvi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #333;
            padding: 20px;
        }
        .admin-card {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        h2 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-add {
            width: 100%;
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-add:hover { background: #2980b9; }
        #optionsContainer { margin-top: 10px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Yangi Savol Qo'shish (Admin)</h2>
    
    <!-- Savol matni -->
    <div class="form-group">
        <label for="questionText">Savol matni:</label>
        <input type="text" id="questionText" placeholder="Savolni kiriting..." required>
    </div>

    <!-- Savol turini tanlash -->
    <div class="form-group">
        <label for="questionType">Savol turi:</label>
        <select id="questionType" onchange="toggleQuestionType()">
            <option value="choice">Variantli savol (A, B, C, D)</option>
            <option value="text">Ochiq matnli savol (Yozma javob)</option>
        </select>
    </div>

    <!-- Variantli savol uchun blok -->
    <div id="choiceBlock">
        <div class="form-group">
            <label>Variantlar va To'g'ri javob:</label>
            <input type="text" id="optA" placeholder="A variant" style="margin-bottom: 5px;">
            <input type="text" id="optB" placeholder="B variant" style="margin-bottom: 5px;">
            <input type="text" id="optC" placeholder="C variant" style="margin-bottom: 5px;">
            <input type="text" id="optD" placeholder="D variant" style="margin-bottom: 10px;">
            
            <label for="correctChoice">To'g'ri variant matnini kiriting:</label>
            <input type="text" id="correctChoice" placeholder="Masalan: HTML">
        </div>
    </div>

    <!-- Ochiq matnli savol uchun blok -->
    <div id="textBlock" style="display: none;">
        <div class="form-group">
            <label for="correctText">To'g'ri matnli javob:</label>
            <input type="text" id="correctText" placeholder="Masalan: Cascading Style Sheets">
            <small style="color: #7f8c8d;">O'quvchi xuddi shu so'z/iborani yozsa to'g'ri hisoblanadi.</small>
        </div>
    </div>

    <button class="btn-add" onclick="addQuestion()">Savolni Bazasiga Qo'shish</button>
</div>

<script>
    // Savol turiga qarab maydonlarni ko'rsatish yoki yashirish
    function toggleQuestionType() {
        const type = document.getElementById("questionType").value;
        if (type === "choice") {
            document.getElementById("choiceBlock").style.display = "block";
            document.getElementById("textBlock").style.display = "none";
        } else {
            document.getElementById("choiceBlock").style.display = "none";
            document.getElementById("textBlock").style.display = "block";
        }
    }

    // Savolni saqlash
    function addQuestion() {
        const qText = document.getElementById("questionText").value.trim();
        const qType = document.getElementById("questionType").value;

        if (!qText) {
            alert("Iltimos, savol matnini kiriting!");
            return;
        }

        let newQuestion = {
            question: qText,
            type: qType
        };

        if (qType === "choice") {
            const a = document.getElementById("optA").value.trim();
            const b = document.getElementById("optB").value.trim();
            const c = document.getElementById("optC").value.trim();
            const d = document.getElementById("optD").value.trim();
            const correct = document.getElementById("correctChoice").value.trim();

            if (!a || !b || !correct) {
                alert("Iltimos, kamida A, B variantlarini va to'g'ri javobni kiriting!");
                return;
            }

            newQuestion.options = [a, b, c, d].filter(opt => opt !== "");
            newQuestion.correct = correct;

        } else if (qType === "text") {
            const correctText = document.getElementById("correctText").value.trim();
            if (!correctText) {
                alert("Iltimos, to'g'ri matnli javobni kiriting!");
                return;
            }
            newQuestion.correct = correctText;
        }

        // Bu yerda Firebase Database-ga saqlash kodingiz bajariladi
        console.log("Saqlanadigan savol ob'ekti:", newQuestion);
        alert("Savol muvaffaqiyatli saqlandi!");
        
        // Formani tozalash
        document.getElementById("questionText").value = "";
        document.getElementById("correctText").value = "";
    }
</script>

</body>
</html>
